<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña · GlobalFoto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23a855f7'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><rect x='23' y='13' width='18' height='8' rx='2.5' fill='%23fff'/><rect x='7' y='19' width='50' height='34' rx='7' fill='%23fff'/><circle cx='32' cy='36' r='12' fill='url(%23g)'/><circle cx='32' cy='36' r='5' fill='%23fff'/></svg>">
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <!-- Contenedor centrado tipo auth -->
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width:440px;">
            
            <!-- Header con logo -->
            <div style="text-align:center;margin-bottom:24px;">
                <a href="/" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-accent flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-camera-retro text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-white">Global<span class="gradient-text">Foto</span></span>
                </a>
            </div>

            <h2 style="color:#fff;font-size:22px;font-weight:800;text-align:center;margin-bottom:8px;">Restablecer contraseña</h2>
            <p style="color:var(--text-muted);font-size:14px;text-align:center;margin-bottom:24px;" id="subtitle-msg">
                Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.
            </p>

            <!-- Alertas dinámicas -->
            <div id="alert-box" class="hidden alert" style="margin-bottom:16px;"></div>

            <!-- Formulario -->
            <form id="reset-form" onsubmit="handleReset(event)">
                <input type="hidden" id="reset-token" value="">
                <input type="hidden" id="reset-email" value="">

                <div class="form-group">
                    <label for="new-pass">Nueva contraseña</label>
                    <input type="password" id="new-pass" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm-pass">Confirmar contraseña</label>
                    <input type="password" id="confirm-pass" placeholder="Repite la contraseña" required minlength="8" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    Guardar nueva contraseña
                </button>
            </form>

            <!-- Footer con vuelta al login -->
            <div style="margin-top:20px;text-align:center;">
                <a href="/panel" style="color:var(--text-muted);font-size:13px;text-decoration:none;transition:color .2s;" 
                   onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
                    ← Volver a Iniciar Sesión
                </a>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Extraer token y email de la URL query string
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const email = params.get('email') || '';

        document.getElementById('reset-token').value = token;
        document.getElementById('reset-email').value = email;

        // Si falta token o email, mostramos error y ocultamos form
        if (!token || !email) {
            showAlert('error', 'Enlace inválido. Por favor solicita uno nuevo desde la página de login.');
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('subtitle-msg').textContent = 'Este enlace parece haber expirado o ser incorrecto.';
        }

        function showAlert(type, msg) {
            const box = document.getElementById('alert-box');
            box.className = 'alert alert-' + type;
            box.textContent = msg;
            box.classList.remove('hidden');
        }

        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            // Validación local simple
            if (newPass !== confirmPass) {
                showAlert('error', 'Las contraseñas no coinciden.');
                return;
            }
            if (newPass.length < 8) {
                showAlert('error', 'La contraseña debe tener al menos 8 caracteres.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Procesando...';

            try {
                const resp = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, email, newPassword: newPass })
                });
                const data = await resp.json();

                if (resp.ok) {
                    showAlert('success', data.mensaje || '¡Contraseña actualizada! Redirigiendo al login...');
                    setTimeout(() => window.location.href = '/panel', 2500);
                } else {
                    showAlert('error', data.error || 'Error al actualizar la contraseña.');
                    btn.disabled = false;
                    btn.innerHTML = 'Guardar nueva contraseña';
                }
            } catch (err) {
                showAlert('error', 'Error de conexión. Inténtalo de nuevo.');
                btn.disabled = false;
                btn.innerHTML = 'Guardar nueva contraseña';
            }
        }
    </script>
</body>
</html>
